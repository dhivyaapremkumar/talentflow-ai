[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talentflow-ai-backend"
version = "0.1.0"
description = "TalentFlow AI recruitment operations and decision-intelligence backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2.9,<3.0",
    "faker>=30.0,<31.0",
    "pandas>=2.2,<2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<8.4",
    "httpx>=0.27,<0.28",
]

[tool.setuptools.packages.find]
include = ["app*", "data_generation*"]
